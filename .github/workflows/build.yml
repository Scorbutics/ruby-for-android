name: Build Ruby Libraries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ruby_version:
        description: "Ruby version to build (one of RUBY_SUPPORTED_VERSIONS in cmake/ruby-app/ruby-versions.cmake)"
        required: true
        default: "3.0.7"
        type: string
      create_release:
        description: "Create a GitHub release with the built artifacts"
        required: false
        default: false
        type: boolean

jobs:
  # ---------------------------------------------------------------------------
  # Ruby version: from the tag on push (v<ruby version>-<build number>, e.g.
  # v3.2.11-1), from the input on manual runs. One release per Ruby version.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ruby_version: ${{ steps.version.outputs.ruby_version }}
    steps:
      - name: Determine Ruby version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$ ]]; then
              echo "::error::Tag '$TAG' does not match v<ruby version>-<build number> (e.g. v3.0.7-1)"
              exit 1
            fi
            RUBY_VERSION="${BASH_REMATCH[1]}"
          else
            RUBY_VERSION="${{ inputs.ruby_version }}"
          fi
          echo "ruby_version=$RUBY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Ruby version: $RUBY_VERSION"

  # Every Ruby patch the build selects must apply, on every supported Ruby
  # version and platform (Ruby patches are strict). Cheap, so it gates the builds.
  check-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Ruby patches
        run: cmake -DWORK_DIR="$RUNNER_TEMP/ruby-patches" -P cmake/ruby-app/tests/check_ruby_patches.cmake

  build:
    needs: [prepare, check-patches]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android ARM64
          - platform: android-arm64
            triplet: aarch64-linux-android
            runner: ubuntu-latest
            use_docker: true
            toolchain: arm64-v8a-android-toolchain.params
            build_type: static

          # Android x86_64
          - platform: android-x86_64
            triplet: x86_64-linux-android
            runner: ubuntu-latest
            use_docker: true
            toolchain: x86_64-android-toolchain.params
            build_type: static

          # Linux x86_64 (glibc)
          # Pinned to ubuntu-22.04 (glibc 2.35) so produced binaries don't
          # depend on __isoc23_* symbols introduced by glibc 2.38 C23 redirects.
          - platform: linux-x86_64
            triplet: x86_64-linux-gnu
            runner: ubuntu-22.04
            use_docker: false
            toolchain: x86_64-linux-toolchain.params
            build_type: static

          # iOS device (arm64)
          - platform: ios-device
            triplet: aarch64-apple-ios-device
            runner: macos-14
            use_docker: false
            toolchain: arm64-ios-device-toolchain.params
            build_type: static

          # iOS simulator (arm64)
          - platform: ios-simulator
            triplet: aarch64-apple-ios-simulator
            runner: macos-14
            use_docker: false
            toolchain: arm64-ios-simulator-toolchain.params
            build_type: static

          # macOS ARM64 (Apple Silicon)
          - platform: macos-arm64
            triplet: aarch64-apple-darwin
            runner: macos-14
            use_docker: false
            toolchain: arm64-macos-toolchain.params
            build_type: static

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Install build dependencies (non-Docker) ---
      - name: Install build dependencies (Linux)
        if: "!matrix.use_docker && runner.os == 'Linux'"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ruby-dev ninja-build \
            libtool autoconf automake libncurses-dev \
            zip unzip wget gettext patch
          # Remove system libffi-dev and libyaml-dev so Ruby never links them:
          # Ruby 3.0/3.1 use their bundled copies (ext/fiddle/libffi,
          # ext/psych/yaml), Ruby 3.2+ the libffi/libyaml this project builds.
          # Either way the static symbols end up in libruby-ext.a.
          sudo apt-get remove -y libffi-dev libyaml-dev 2>/dev/null || true

      - name: Install build dependencies (macOS)
        if: "!matrix.use_docker && runner.os == 'macOS'"
        run: |
          brew install autoconf automake libtool cmake

      # --- Configure ---
      - name: Configure (Docker)
        if: matrix.use_docker
        run: |
          STATIC_FLAG=""
          if [ "${{ matrix.build_type }}" = "static" ]; then
            STATIC_FLAG="--enable-static"
          fi
          ./configure \
            --with-toolchain-params=${{ matrix.toolchain }} \
            --build-dir=build-${{ matrix.platform }} \
            --with-ruby-version=${{ needs.prepare.outputs.ruby_version }} \
            $STATIC_FLAG

      - name: Configure (local)
        if: "!matrix.use_docker"
        run: |
          STATIC_FLAG=""
          if [ "${{ matrix.build_type }}" = "static" ]; then
            STATIC_FLAG="--enable-static"
          fi
          ./configure \
            --without-docker \
            --with-toolchain-params=${{ matrix.toolchain }} \
            --build-dir=build-${{ matrix.platform }} \
            --with-ruby-version=${{ needs.prepare.outputs.ruby_version }} \
            $STATIC_FLAG

      # --- Build ---
      - name: Build
        run: make build

      # --- Link test (verify no missing symbols) ---
      - name: Link test
        run: |
          if [ "${{ matrix.use_docker }}" = "true" ]; then
            docker exec ruby-for-android_dev cmake --build /opt/current/build --target link_test
          else
            cmake --build build-${{ matrix.platform }} --target link_test
          fi

      # --- Install (produces ZIP) ---
      - name: Install
        run: make install

      - name: List artifacts
        run: |
          echo "=== Build artifacts ==="
          ls -lh target/

      # --- Upload ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruby-libs-${{ matrix.platform }}
          path: target/ruby_full-*.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Create GitHub Release (on tag push or manual trigger)
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts/ -name '*.zip' -exec cp {} release/ \;
          echo "=== Release assets ==="
          ls -lh release/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ needs.prepare.outputs.ruby_version }}-$(date +%Y%m%d)-manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Ruby Libraries ${{ steps.tag.outputs.tag }}
          body: |
            Prebuilt Ruby ${{ needs.prepare.outputs.ruby_version }} libraries for all supported platforms.

            ## Platforms
            - `android-arm64` — Android ARM64 (static)
            - `android-x86_64` — Android x86_64 (static)
            - `linux-x86_64` — Linux x86_64 glibc (static)
            - `ios-device` — iOS device ARM64 (static)
            - `ios-simulator` — iOS simulator ARM64 (static)
            - `macos-arm64` — macOS ARM64 Apple Silicon (static)

            ## Usage
            Download the ZIP for your target platform and extract into your project's `external/` directory.
          files: release/*
          draft: false
          prerelease: false
